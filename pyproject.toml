[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-roofline-project"
version = "0.1.0"
description = "Portable PyTorch training benchmark, NVML telemetry and empirical roofline plots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "psutil>=5.9", "nvidia-ml-py>=12"]

[project.scripts]
gpu-roofline = "gpumodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
